name: Node.js CI/CD
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          cache: true
      - name: Check types with TypeScript
        run: pnpm typecheck
      - name: Check formatting with Prettier
        run: pnpm format
      - name: Build with tsdown
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist
